<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Image translation fixture</title>
<style>body{font:18px system-ui;padding:40px;max-width:900px}img{display:block;max-width:420px;max-height:180px;margin:18px 0;border:1px solid #ddd}</style></head>
<body><h1>Image translation</h1><p id="text">A lease is a time-limited ownership token.</p>
<img id="data-image" alt="A sign saying Hello from Yomeru">
<img id="blob-image" alt="A second sign">
<img id="remote-image" alt="A remotely hosted sign">
<script>
const canvas = document.createElement("canvas");
canvas.width = 4096; canvas.height = 1024;
const ctx = canvas.getContext("2d");
ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = "#222"; ctx.font = "160px sans-serif"; ctx.fillText("Hello from Yomeru", 160, 550);
document.getElementById("data-image").src = canvas.toDataURL("image/png");
canvas.toBlob(blob => { document.getElementById("blob-image").src = URL.createObjectURL(blob); }, "image/png");
</script></body></html>

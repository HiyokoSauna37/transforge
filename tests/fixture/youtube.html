<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Yomeru YouTube subtitle fixture</title>
<style>
body{margin:0;padding:30px;background:#f7f4ee;font:16px/1.6 system-ui,sans-serif}
main{max-width:960px;margin:auto}#movie_player{position:relative;width:900px;height:506px;background:#272520;overflow:hidden;color:white}
video{width:100%;height:100%}.ytp-caption-window-container{position:absolute;bottom:30px;left:25%;right:25%;text-align:center;background:#111}
</style>
</head>
<body>
<main><h1>字幕の同期と自然な翻訳</h1><ytd-watch-flexy><div id="movie_player"><video muted preload="auto"></video><div class="ytp-caption-window-container">YouTube の元字幕</div></div></ytd-watch-flexy><p>ページの文章は字幕とは別に扱います。</p></main>
<script>
const videoId = new URL(location.href).searchParams.get("v") || "dQw4w9WgXcQ";
document.querySelector("ytd-watch-flexy").setAttribute("video-id", videoId);
window.ytInitialPlayerResponse = {
  videoDetails: { videoId, title: "字幕の同期と自然な翻訳", lengthSeconds: "200" },
  captions: { playerCaptionsTracklistRenderer: {
    captionTracks: [{ baseUrl: `https://www.youtube.com/api/timedtext?v=${videoId}&lang=ja`, languageCode: "ja", vssId: ".ja", name: { simpleText: "日本語" } }],
  } },
};
document.getElementById("movie_player").getPlayerResponse = () => window.ytInitialPlayerResponse;
// 実DOMのcurrentTimeを使うため、短時間で生成できる無音WAVをvideoに読み込む。
// MAIN world の独自getterで時間を偽装すると isolated world から見えないため使わない。
const samples = 8000 * 200;
const wav = new Uint8Array(44 + samples);
wav.fill(128, 44);
const header = new DataView(wav.buffer);
const word = (offset, text) => [...text].forEach((c, i) => header.setUint8(offset + i, c.charCodeAt(0)));
word(0, "RIFF"); header.setUint32(4, 36 + samples, true); word(8, "WAVE"); word(12, "fmt ");
header.setUint32(16, 16, true); header.setUint16(20, 1, true); header.setUint16(22, 1, true);
header.setUint32(24, 8000, true); header.setUint32(28, 8000, true); header.setUint16(32, 1, true); header.setUint16(34, 8, true);
word(36, "data"); header.setUint32(40, samples, true);
document.querySelector("video").src = URL.createObjectURL(new Blob([wav], { type: "audio/wav" }));
</script>
</body>
</html>

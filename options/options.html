<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TransForge 設定</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="options.css">
</head>
<body>
<div id="app">
  <header class="mast">
    <img class="mark" src="../icons/icon48.png" alt="">
    <div>
      <h1>TransForge 設定</h1>
      <div class="sub">Claude API でページを自然な日本語に翻訳する、自分用の拡張</div>
    </div>
    <span class="spacer"></span>
    <span class="dim" id="ver"></span>
  </header>

  <section class="card">
    <h2>接続</h2>
    <div class="field">
      <label for="apiKey">Anthropic API キー</label>
      <div class="inline">
        <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false">
        <button class="btn ghost small" id="toggleKey">表示</button>
        <button class="btn small" id="testKey">接続テスト</button>
      </div>
      <p class="help">この端末の <code>chrome.storage.local</code> にだけ保存され、同期されません。リクエストは拡張から <code>api.anthropic.com</code> へ直接送られます。</p>
      <p id="testResult" class="help"></p>
    </div>
    <div class="field">
      <label for="apiBase">API ベース URL（通常は変更不要）</label>
      <input type="text" id="apiBase" placeholder="https://api.anthropic.com" spellcheck="false">
    </div>
  </section>

  <section class="card">
    <h2>翻訳</h2>
    <div class="grid2">
      <div class="field">
        <label for="model">モデル</label>
        <select id="model"></select>
        <p class="help" id="modelPrice"></p>
      </div>
      <div class="field">
        <label for="effort">effort（思考の深さ）</label>
        <select id="effort"></select>
        <p class="help">翻訳は low で十分なことが多く、いちばん速くて安い。</p>
      </div>
      <div class="field">
        <label for="targetLang">翻訳先の言語</label>
        <input type="text" id="targetLang" list="langs" placeholder="日本語">
        <datalist id="langs"></datalist>
      </div>
      <div class="field">
        <label>既定の表示</label>
        <div class="seg" id="modeSeg">
          <button data-mode="replace" class="segbtn">置き換え</button>
          <button data-mode="bilingual" class="segbtn">対訳（原文の下に訳文）</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="customInstructions">追加の指示（文体・分野など）</label>
      <textarea id="customInstructions" placeholder="例: Apache Camel の公式ドキュメントとして、Camel 日本語コミュニティで一般的な訳語を使う。"></textarea>
    </div>
    <div class="field">
      <label for="glossary">用語集（1 行 1 語・<code>原語 = 訳語</code>）</label>
      <textarea id="glossary" placeholder="exchange = エクスチェンジ&#10;route = ルート&#10;MDN = MDN（メッセージ処理通知）"></textarea>
    </div>
    <label class="check"><input type="checkbox" id="skipNav"><span class="box"></span>ナビゲーションやサイドバー（nav, aside）は翻訳しない（速く・安くなる）</label>
  </section>

  <section class="card">
    <h2>詳細</h2>
    <div class="grid3">
      <div class="field">
        <label for="batchChars">1 リクエストの文字数上限</label>
        <input type="number" id="batchChars" min="500" max="8000" step="100">
        <p class="help">小さいほど早く表示が始まり、大きいほど文脈が安定します。</p>
      </div>
      <div class="field">
        <label for="concurrency">同時リクエスト数</label>
        <input type="number" id="concurrency" min="1" max="8">
        <p class="help">レート制限に当たるときは減らしてください。</p>
      </div>
      <div class="field">
        <label for="usdJpy">表示用レート（1 USD = ? 円）</label>
        <input type="number" id="usdJpy" min="50" max="400" step="0.5">
      </div>
    </div>
    <label class="check"><input type="checkbox" id="cacheEnabled"><span class="box"></span>翻訳キャッシュを使う（同じ文は再課金しない）</label>
    <div class="inline" style="margin-top:10px">
      <span class="dim" id="cacheStats">cache: --</span>
      <button class="btn ghost small" id="clearCache">キャッシュを消す</button>
    </div>
    <div class="field" style="margin-top:14px">
      <label for="autoHosts">常に翻訳するサイト（1 行 1 ホスト）</label>
      <textarea id="autoHosts" placeholder="camel.apache.org" spellcheck="false"></textarea>
    </div>
  </section>

  <section class="card">
    <h2>使用量</h2>
    <div class="usage" id="usage"></div>
    <div class="inline" style="margin-top:10px">
      <button class="btn ghost small" id="resetUsage">累計をリセット</button>
    </div>
  </section>

  <div class="savebar">
    <button class="btn" id="save">保存</button>
    <span id="saved" class="ok" hidden>保存しました</span>
  </div>
</div>
<script type="module" src="options.js"></script>
</body>
</html>
